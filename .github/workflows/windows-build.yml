name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish Windows x64 package
        shell: pwsh
        run: ./build.ps1
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: abyss-auto-win-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
